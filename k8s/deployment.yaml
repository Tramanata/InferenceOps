apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-server
  labels:
    app: inference-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-server
  template:
    metadata:
      labels:
        app: inference-server
    spec:
      containers:
      - name: inference-server
        image: roboflow/roboflow-inference-server-cpu:latest
        ports:
        - containerPort: 9001
        volumeMounts:
          - mountPath: /tmp
            name: inference-cache
      volumes:
        - name: inference-cache
          emptyDir: {}
